# SonarQube Cloud automatic analysis settings.
#
# docs/prototypes/ holds superseded prototype code kept only as a written
# record (see its README). None of it is built, packaged, or referenced by
# the driver or the userspace tools, so analysing it reports issues in code
# that cannot run anywhere. Its loader was the sole finding behind a failed
# Security rating on new code.
sonar.exclusions=docs/prototypes/**
