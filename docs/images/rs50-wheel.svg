<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img"
     aria-label="RS50 racing wheel: a round leather rim with a marker at twelve o'clock and a brushed hub plate carrying a lit strip, lettered buttons and two knurled encoders">
  <title>Logitech RS50</title>
  <desc>
    Original drawing, not traced from any vendor photograph. A round rim with
    a pale marker at twelve o'clock, and a hub mounted inside it: a black top
    bar carrying the lit strip and face buttons, a brushed plate with its bolt
    circle, thumb paddles and a knurled encoder on each side, and a stem down
    to the lower rim.
  </desc>

  <defs>
    <!-- Rim: light from above, so the upper arc is lifted and the lower one
         falls away. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3b4048"/>
      <stop offset="0.35" stop-color="#2b3037"/>
      <stop offset="1"    stop-color="#1e2228"/>
    </linearGradient>
    <!-- The hub plate is the one pale surface, brushed and slightly blue. -->
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#454e59"/>
      <stop offset="0.45" stop-color="#333b45"/>
      <stop offset="1"    stop-color="#232931"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3a4048"/>
      <stop offset="0.6"  stop-color="#22262c"/>
      <stop offset="1"    stop-color="#15181c"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#454c56"/>
      <stop offset="0.4"  stop-color="#282d33"/>
      <stop offset="1"    stop-color="#14171a"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#25e07c"/>
      <stop offset="0.22" stop-color="#c9f23b"/>
      <stop offset="0.44" stop-color="#f2a33b"/>
      <stop offset="0.64" stop-color="#f2453b"/>
      <stop offset="0.84" stop-color="#a03bf2"/>
      <stop offset="1"    stop-color="#2f6ee0"/>
    </linearGradient>
    <!-- Brushed-metal streaks for the plate. -->
    <pattern id="brush" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1 H4" stroke="#000"    stroke-width="0.8" opacity="0.16"/>
      <path d="M0 3 H4" stroke="#9aa4b1" stroke-width="0.5" opacity="0.10"/>
    </pattern>
    <!-- Leather grain for the rim. -->
    <pattern id="hide" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.8" fill="#79828f" opacity="0.16"/>
      <circle cx="4.5" cy="4"   r="0.6" fill="#000"    opacity="0.26"/>
    </pattern>
  </defs>

  <!-- Rim. -->
  <path d="M200 24 a176 176 0 1 1 -0.1 0 z M200 60 a140 140 0 1 0 0.1 0 z"
        fill="url(#rim)" fill-rule="evenodd"/>
  <path d="M200 24 a176 176 0 1 1 -0.1 0 z M200 60 a140 140 0 1 0 0.1 0 z"
        fill="url(#hide)" fill-rule="evenodd"/>
  <!-- Inner and outer edge catches. -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#79828f" stroke-width="1.6" opacity="0.22"/>
  <circle cx="200" cy="200" r="141" fill="none" stroke="#000" stroke-width="2" opacity="0.55"/>
  <!-- Marker at twelve o'clock. -->
  <path d="M186 24 h28 v30 h-28 z" fill="#b9c0c8"/>
  <path d="M186 24 h28 v10 h-28 z" fill="#d7dce2"/>
  <!-- Stitch seams around the rim. -->
  <g stroke="#0a0c0e" stroke-width="3" opacity="0.7">
    <path d="M78 84 l22 22"/><path d="M322 84 l-22 22"/>
    <path d="M78 316 l22-22"/><path d="M322 316 l-22-22"/>
  </g>

  <!-- Lower stem, hub down to the rim. -->
  <path d="M172 296 h56 l-6 44 h-44 z" fill="#20242a"/>
  <path d="M176 330 h48 v14 h-48 z" fill="#191c21"/>

  <!-- Shift paddles, tucked either side of the hub. -->
  <path d="M56 128 h22 q6 0 5 7 l-6 34 q-1 7 -7 7 h-20 q-6 0 -5-7 l6-34
           q1-7 5-7 z" fill="#1d2126"/>
  <path d="M344 128 h-22 q-6 0 -5 7 l6 34 q1 7 7 7 h20 q6 0 5-7 l-6-34
           q-1-7 -5-7 z" fill="#1d2126"/>
  <g stroke="#8d96a2" stroke-width="2.4" fill="none" stroke-linecap="round"
     stroke-linejoin="round" opacity="0.8">
    <path d="M72 140 l-7 7 l7 7"/><path d="M64 140 l-7 7 l7 7"/>
    <path d="M328 140 l7 7 l-7 7"/><path d="M336 140 l7 7 l-7 7"/>
  </g>

  <!-- Hub surround: the black body the plate is set into. -->
  <path d="M86 100 h228 a12 12 0 0 1 12 12 v150 a14 14 0 0 1 -9 13
           l-107 33 a16 16 0 0 1 -10 0 l-107-33 a14 14 0 0 1 -9-13 V112
           a12 12 0 0 1 12-12 z" fill="url(#bar)"/>

  <!-- Cooling ribs along the top of the hub. -->
  <g fill="#2b3138">
    <rect x="160" y="90" width="10" height="12" rx="3"/>
    <rect x="178" y="90" width="10" height="12" rx="3"/>
    <rect x="196" y="90" width="10" height="12" rx="3"/>
    <rect x="214" y="90" width="10" height="12" rx="3"/>
    <rect x="232" y="90" width="10" height="12" rx="3"/>
  </g>

  <!-- Lit strip across the top bar. -->
  <rect x="146" y="112" width="108" height="16" rx="7" fill="#0a0c0f"/>
  <rect x="150" y="115" width="100" height="10" rx="4" fill="url(#led)"/>
  <rect x="150" y="115" width="100" height="3.5" rx="1.8" fill="#fff" opacity="0.30"/>

  <!-- Brushed plate set into the hub. -->
  <path d="M112 140 h176 v104 a10 10 0 0 1 -7 10 l-81 26 a12 12 0 0 1 -8 0
           l-81-26 a10 10 0 0 1 -7-10 z" fill="url(#plate)"/>
  <path d="M112 140 h176 v104 a10 10 0 0 1 -7 10 l-81 26 a12 12 0 0 1 -8 0
           l-81-26 a10 10 0 0 1 -7-10 z" fill="url(#brush)"/>

  <!-- Bolt circle on the plate. -->
  <g fill="#181b1f">
    <circle cx="200" cy="152" r="5"/>
    <circle cx="156" cy="176" r="5"/><circle cx="244" cy="176" r="5"/>
    <circle cx="156" cy="222" r="5"/><circle cx="244" cy="222" r="5"/>
    <circle cx="200" cy="246" r="5"/>
  </g>
  <!-- Centre boss. No maker's mark is reproduced. -->
  <circle cx="200" cy="199" r="26" fill="#272d35"/>
  <circle cx="200" cy="199" r="26" fill="none" stroke="#000" stroke-width="1.4" opacity="0.4"/>

  <!-- Face buttons on the top bar. -->
  <g font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <g fill="#191c21" stroke="#5f6874" stroke-width="1.4">
      <circle cx="100" cy="120" r="13"/><circle cx="128" cy="120" r="13"/>
      <circle cx="272" cy="120" r="13"/><circle cx="300" cy="120" r="13"/>
    </g>
    <g fill="#ccd3db">
      <text x="100" y="124">X</text><text x="128" y="124">Y</text>
      <text x="272" y="124">A</text><text x="300" y="124">B</text>
    </g>
  </g>

  <!-- Shoulder columns on the hub surround. -->
  <g font-family="sans-serif" font-size="8" text-anchor="middle">
    <g fill="#191c21" stroke="#5f6874" stroke-width="1.3">
      <circle cx="99" cy="171" r="12"/><circle cx="99" cy="197" r="12"/>
      <circle cx="301" cy="171" r="12"/><circle cx="301" cy="197" r="12"/>
    </g>
    <g fill="#a2abb6">
      <text x="99" y="174">LT</text><text x="99" y="200">LSB</text>
      <text x="301" y="174">RT</text><text x="301" y="200">RSB</text>
    </g>
  </g>

  <!-- D-pad nub, inboard of the LT column. -->
  <circle cx="131" cy="185" r="11" fill="#14171b" stroke="#5f6874" stroke-width="1.4"/>
  <circle cx="131" cy="185" r="4.5" fill="#39404a"/>

  <!-- Thumb paddles either side of the plate's lower half. -->
  <path d="M104 226 q34-6 52 8 l-4 34 q-2 9 -11 9 h-32 q-10 0 -12-10 l-4-30
           q-1-9 11-11 z" fill="#20242a"/>
  <path d="M296 226 q-34-6 -52 8 l4 34 q2 9 11 9 h32 q10 0 12-10 l4-30
           q1-9 -11-11 z" fill="#20242a"/>
  <g font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">
    <circle cx="124" cy="236" r="13" fill="#191c21" stroke="#5f6874" stroke-width="1.4"/>
    <text x="124" y="239" fill="#a2abb6">GL</text>
    <circle cx="276" cy="236" r="13" fill="#191c21" stroke="#5f6874" stroke-width="1.4"/>
    <text x="276" y="239" fill="#a2abb6">GR</text>
  </g>

  <!-- Camera/view left, menu right, and the guide button on the plate. -->
  <circle cx="143" cy="268" r="11" fill="#191c21" stroke="#5f6874" stroke-width="1.3"/>
  <g stroke="#a2abb6" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <rect x="137" y="264" width="9" height="8" rx="2"/>
    <path d="M146 266 l4-2.5 v7 l-4-2.5 z" fill="#a2abb6" stroke="none"/>
  </g>
  <circle cx="257" cy="268" r="11" fill="#191c21" stroke="#5f6874" stroke-width="1.3"/>
  <g stroke="#a2abb6" stroke-width="1.8" stroke-linecap="round">
    <path d="M252 265 h10 M252 268 h10 M252 271 h10"/>
  </g>
  <circle cx="200" cy="272" r="11" fill="#1a1e23" stroke="#5f6874" stroke-width="1.3"/>
  <circle cx="200" cy="272" r="4.5" fill="#39404a"/>

  <!-- Knurled encoders with their blue collars. -->
  <g>
    <rect x="76" y="252" width="40" height="30" rx="10" fill="url(#knob)"/>
    <g stroke="#000" stroke-width="1.8" opacity="0.45">
      <path d="M84 256 v22 M92 256 v22 M100 256 v22 M108 256 v22"/>
    </g>
    <rect x="112" y="252" width="7" height="30" rx="3.5" fill="#1f9fd8"/>
  </g>
  <g>
    <rect x="284" y="252" width="40" height="30" rx="10" fill="url(#knob)"/>
    <g stroke="#000" stroke-width="1.8" opacity="0.45">
      <path d="M292 256 v22 M300 256 v22 M308 256 v22 M316 256 v22"/>
    </g>
    <rect x="281" y="252" width="7" height="30" rx="3.5" fill="#1f9fd8"/>
  </g>

  <!-- Power indicator on the stem. -->
  <circle cx="200" cy="316" r="3.6" fill="#25e07c"/>
</svg>
