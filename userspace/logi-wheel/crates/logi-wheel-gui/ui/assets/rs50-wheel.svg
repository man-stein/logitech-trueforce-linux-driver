<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"
     aria-label="RS50 wheel hub: a formula-style hub with swept wing grips, a lit strip along the top and a knurled encoder at each lower corner">
  <title>Logitech RS50</title>
  <desc>
    Original drawing, not traced from any vendor photograph. A formula-style
    hub: swept grips either side, a lit strip recessed into the top bar, a
    button cluster on a ribbed faceplate, thumb paddles and a knurled encoder
    at each lower corner.
  </desc>

  <defs>
    <!-- One light source, high and slightly left, so every bevel below uses
         a lighter top edge and a darker bottom one. -->
    <linearGradient id="rs-plate" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0"    stop-color="#434a53"/>
      <stop offset="0.38" stop-color="#333941"/>
      <stop offset="1"    stop-color="#1d2126"/>
    </linearGradient>
    <linearGradient id="rs-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#474e58"/>
      <stop offset="1" stop-color="#282d34"/>
    </linearGradient>
    <linearGradient id="rs-wing" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0"    stop-color="#2b3037"/>
      <stop offset="0.55" stop-color="#1e2228"/>
      <stop offset="1"    stop-color="#141619"/>
    </linearGradient>
    <linearGradient id="rs-wing-r" x1="1" y1="0" x2="0" y2="0.4">
      <stop offset="0"    stop-color="#2b3037"/>
      <stop offset="0.55" stop-color="#1e2228"/>
      <stop offset="1"    stop-color="#141619"/>
    </linearGradient>
    <linearGradient id="rs-paddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333941"/>
      <stop offset="1" stop-color="#1c2025"/>
    </linearGradient>
    <linearGradient id="rs-led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2fe07a"/>
      <stop offset="0.30" stop-color="#f2d93b"/>
      <stop offset="0.56" stop-color="#f2593b"/>
      <stop offset="0.80" stop-color="#a03bf2"/>
      <stop offset="1"    stop-color="#2f6ee0"/>
    </linearGradient>
    <!-- Fine horizontal ribbing on the faceplate: the texture that still
         reads at small sizes, where a finer pattern would turn to mud. -->
    <pattern id="rs-ribs" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 1.5 H6" stroke="#000"    stroke-width="1.2" opacity="0.22"/>
      <path d="M0 2.9 H6" stroke="#79828f" stroke-width="0.6" opacity="0.10"/>
    </pattern>
  </defs>

  <ellipse cx="210" cy="286" rx="132" ry="9" fill="#000" opacity="0.25"/>

  <!-- Swept grips. Drawn first and overlapped by the faceplate, so the hub
       reads as one assembly rather than three floating parts. -->
  <path d="M118 74 q-52 6 -66 40 q-14 36 -2 92 q4 20 24 20 h44 q-16-72 0-152 z"
        fill="url(#rs-wing)"/>
  <path d="M302 74 q52 6 66 40 q14 36 2 92 q-4 20 -24 20 h-44 q16-72 0-152 z"
        fill="url(#rs-wing-r)"/>
  <path d="M118 76 q-50 6 -64 39" stroke="#5b636e" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M302 76 q50 6 64 39" stroke="#5b636e" stroke-width="2" fill="none" opacity="0.45"/>
  <g stroke="#79828f" stroke-width="3.6" fill="none" stroke-linecap="round"
     stroke-linejoin="round" opacity="0.65">
    <path d="M78 128 l-11 12 l11 12"/>
    <path d="M342 128 l11 12 l-11 12"/>
  </g>

  <!-- Faceplate: a broad shield, widest at the shoulders, tapering to the
       quick-release boss. -->
  <path d="M116 62 h188 a14 14 0 0 1 14 14 v104 a16 16 0 0 1 -9 14
           l-84 42 a18 18 0 0 1 -16 0 l-84-42 a16 16 0 0 1 -9-14 V76
           a14 14 0 0 1 14-14 z"
        fill="url(#rs-plate)"/>
  <path d="M116 62 h188 a14 14 0 0 1 14 14 v104 a16 16 0 0 1 -9 14
           l-84 42 a18 18 0 0 1 -16 0 l-84-42 a16 16 0 0 1 -9-14 V76
           a14 14 0 0 1 14-14 z"
        fill="url(#rs-ribs)"/>
  <path d="M118 64 h184" stroke="#79828f" stroke-width="2" opacity="0.35"/>

  <!-- Raised top bar carrying the face buttons and the lit strip. -->
  <path d="M124 56 h172 a12 12 0 0 1 12 12 v22 H112 V68 a12 12 0 0 1 12-12 z"
        fill="url(#rs-bar)"/>
  <path d="M126 58 h168" stroke="#8d95a1" stroke-width="1.8" opacity="0.40"/>

  <!-- LIGHTSYNC strip, recessed into the bar. -->
  <rect x="164" y="60" width="92" height="18" rx="8" fill="#0c0e11"/>
  <rect x="168" y="63" width="84" height="12" rx="5" fill="url(#rs-led)"/>
  <rect x="168" y="63" width="84" height="4"  rx="2" fill="#fff" opacity="0.28"/>

  <!-- Face buttons: X/Y left, A/B right. -->
  <g font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <g fill="#1c1f24" stroke="#5b636e" stroke-width="1.5">
      <circle cx="132" cy="78" r="13"/><circle cx="158" cy="78" r="13"/>
      <circle cx="262" cy="78" r="13"/><circle cx="288" cy="78" r="13"/>
    </g>
    <g fill="#c3cad3">
      <text x="132" y="83">X</text><text x="158" y="83">Y</text>
      <text x="262" y="83">A</text><text x="288" y="83">B</text>
    </g>
  </g>

  <!-- Shoulder columns. -->
  <g font-family="sans-serif" font-size="9" text-anchor="middle">
    <g fill="#1c1f24" stroke="#5b636e" stroke-width="1.4">
      <circle cx="136" cy="120" r="13"/><circle cx="136" cy="152" r="13"/>
      <circle cx="284" cy="120" r="13"/><circle cx="284" cy="152" r="13"/>
    </g>
    <g fill="#9aa3ad">
      <text x="136" y="124">LT</text><text x="136" y="156">LSB</text>
      <text x="284" y="124">RT</text><text x="284" y="156">RSB</text>
    </g>
  </g>

  <!-- D-pad, recessed. -->
  <circle cx="174" cy="132" r="17" fill="#15181c" stroke="#5b636e" stroke-width="1.5"/>
  <path d="M174 121 v22 M163 132 h22" stroke="#79828f" stroke-width="4"
        stroke-linecap="round"/>

  <!-- Centre boss and its bolt circle. No maker's mark is reproduced. -->
  <circle cx="210" cy="146" r="31" fill="#191c21" stroke="#4d545e" stroke-width="2"/>
  <circle cx="210" cy="146" r="20" fill="#252a30"/>
  <circle cx="210" cy="146" r="20" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
  <g fill="#454c56">
    <circle cx="210" cy="110" r="3.6"/><circle cx="210" cy="182" r="3.6"/>
    <circle cx="176" cy="146" r="3.6"/><circle cx="244" cy="146" r="3.6"/>
  </g>

  <!-- Thumb paddles, angled in toward the boss. -->
  <path d="M140 176 h56 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-36
           a12 12 0 0 1 -11-7 l-14-22 a8 8 0 0 1 5-11 z" fill="url(#rs-paddle)"/>
  <path d="M280 176 h-56 a10 10 0 0 0 -10 10 v20 a10 10 0 0 0 10 10 h36
           a12 12 0 0 0 11-7 l14-22 a8 8 0 0 0 -5-11 z" fill="url(#rs-paddle)"/>
  <g font-family="sans-serif" font-size="10" text-anchor="middle">
    <g fill="#1c1f24" stroke="#5b636e" stroke-width="1.4">
      <circle cx="158" cy="192" r="12"/><circle cx="262" cy="192" r="12"/>
    </g>
    <g fill="#9aa3ad"><text x="158" y="196">GL</text><text x="262" y="196">GR</text></g>
  </g>

  <!-- Camera/view and menu, inboard of the paddles. -->
  <g fill="#1c1f24" stroke="#5b636e" stroke-width="1.3">
    <circle cx="182" cy="210" r="10"/><circle cx="238" cy="210" r="10"/>
  </g>
  <g stroke="#9aa3ad" stroke-width="1.5" fill="none" stroke-linecap="round">
    <rect x="177" y="206" width="9" height="7" rx="1.5"/>
    <path d="M234 207 h8 M234 210 h8 M234 213 h8"/>
  </g>

  <!-- Knurled encoders with their blue collars. -->
  <g>
    <rect x="86" y="188" width="36" height="34" rx="10" fill="#171a1e" stroke="#4d545e" stroke-width="1.5"/>
    <g stroke="#5f6873" stroke-width="1.6" opacity="0.8">
      <path d="M93 193 v24 M101 193 v24 M109 193 v24 M117 193 v24"/>
    </g>
    <rect x="86" y="214" width="36" height="6" rx="3" fill="#1f9fd8"/>
  </g>
  <g>
    <rect x="298" y="188" width="36" height="34" rx="10" fill="#171a1e" stroke="#4d545e" stroke-width="1.5"/>
    <g stroke="#5f6873" stroke-width="1.6" opacity="0.8">
      <path d="M305 193 v24 M313 193 v24 M321 193 v24 M329 193 v24"/>
    </g>
    <rect x="298" y="214" width="36" height="6" rx="3" fill="#1f9fd8"/>
  </g>

  <!-- G1 on the lower boss, with the power indicator below it. -->
  <circle cx="210" cy="212" r="14" fill="#1c1f24" stroke="#5b636e" stroke-width="1.6"/>
  <text x="210" y="216" font-family="sans-serif" font-size="10"
        text-anchor="middle" fill="#9aa3ad">G1</text>
  <path d="M196 238 h28 l-5 16 h-18 z" fill="#20242a"/>
  <circle cx="210" cy="248" r="3.4" fill="#2fe07a"/>
</svg>
