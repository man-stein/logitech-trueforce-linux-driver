<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img"
     aria-label="G PRO wheel: a round rim with an open lower section, a pale faceplate, rev lights and two large paddles">
  <title>Logitech G PRO Racing Wheel</title>
  <desc>
    Original drawing, not traced from any vendor photograph. A round rim with
    the lower section open, a pale metal faceplate carrying a rev-light strip
    and lettered buttons, and a large paddle either side of the centre boss.
  </desc>

  <defs>
    <linearGradient id="gp-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#3d434b"/>
      <stop offset="0.45" stop-color="#24282e"/>
      <stop offset="1"   stop-color="#15171b"/>
    </linearGradient>
    <!-- The faceplate is the one pale surface on this wheel and is most of
         what distinguishes it at a glance, so it gets its own ramp. -->
    <linearGradient id="gp-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8d949d"/>
      <stop offset="0.5" stop-color="#6d747d"/>
      <stop offset="1"   stop-color="#525860"/>
    </linearGradient>
    <linearGradient id="gp-paddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3138"/>
      <stop offset="1" stop-color="#181b1f"/>
    </linearGradient>
    <!-- Perforation on the grips, one tile, reused. -->
    <pattern id="gp-perf" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#000" opacity="0.42"/>
      <circle cx="8" cy="8" r="1.3" fill="#000" opacity="0.42"/>
    </pattern>
  </defs>

  <ellipse cx="210" cy="360" rx="120" ry="10" fill="#000" opacity="0.26"/>

  <!-- Rim: a thick ring with the lower third cut away, which is the
       silhouette people recognise. -->
  <path d="M210 34 a134 134 0 0 1 134 134 v34 a134 134 0 0 1 -46 101
           l-24-26 a100 100 0 0 0 36-76 v-33 a100 100 0 0 0 -200 0 v33
           a100 100 0 0 0 36 76 l-24 26 a134 134 0 0 1 -46-101 v-34
           A134 134 0 0 1 210 34 z"
        fill="url(#gp-rim)"/>
  <path d="M210 34 a134 134 0 0 1 134 134 v34 a134 134 0 0 1 -46 101
           l-24-26 a100 100 0 0 0 36-76 v-33 a100 100 0 0 0 -200 0 v33
           a100 100 0 0 0 36 76 l-24 26 a134 134 0 0 1 -46-101 v-34
           A134 134 0 0 1 210 34 z"
        fill="url(#gp-perf)"/>
  <!-- Centre marker at twelve o'clock. -->
  <rect x="200" y="34" width="20" height="26" rx="4" fill="#9aa3ad"/>

  <!-- Lower rim bar, closing the grip. -->
  <path d="M120 300 q90 46 180 0 l-14-22 q-76 36 -152 0 z" fill="url(#gp-rim)"/>

  <!-- Faceplate. -->
  <path d="M124 150 h172 a10 10 0 0 1 10 10 v96 a12 12 0 0 1 -7 11 l-79 30
           a18 18 0 0 1 -20 0 l-79-30 a12 12 0 0 1 -7-11 v-96 a10 10 0 0 1 10-10 z"
        fill="url(#gp-plate)"/>

  <!-- Rev-light strip along the top of the plate. -->
  <rect x="146" y="132" width="128" height="16" rx="7" fill="#14171b"/>
  <g>
    <circle cx="160" cy="140" r="3.6" fill="#2fe07a"/>
    <circle cx="176" cy="140" r="3.6" fill="#2fe07a"/>
    <circle cx="192" cy="140" r="3.6" fill="#2fe07a"/>
    <circle cx="208" cy="140" r="3.6" fill="#f2d93b"/>
    <circle cx="224" cy="140" r="3.6" fill="#f2d93b"/>
    <circle cx="240" cy="140" r="3.6" fill="#f2593b"/>
    <circle cx="256" cy="140" r="3.6" fill="#3b7bf2"/>
  </g>

  <!-- Lettered buttons: X/Y left, A/B right, in the wheel's accent colours. -->
  <g font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="146" cy="168" r="13" fill="#20242a"/>
    <text x="146" y="173" fill="#3b9bf2">X</text>
    <circle cx="176" cy="168" r="13" fill="#20242a"/>
    <text x="176" y="173" fill="#f2d93b">Y</text>
    <circle cx="244" cy="168" r="13" fill="#20242a"/>
    <text x="244" y="173" fill="#2fe07a">A</text>
    <circle cx="274" cy="168" r="13" fill="#20242a"/>
    <text x="274" y="173" fill="#f2593b">B</text>
  </g>

  <!-- Shoulder buttons and thumb stick. -->
  <g font-family="sans-serif" font-size="9" text-anchor="middle">
    <circle cx="142" cy="204" r="13" fill="#20242a"/>
    <text x="142" y="208" fill="#aeb6c0">LT</text>
    <circle cx="278" cy="204" r="13" fill="#20242a"/>
    <text x="278" y="208" fill="#aeb6c0">RT</text>
  </g>
  <circle cx="170" cy="226" r="9" fill="#1b1e23" stroke="#3b9bf2" stroke-width="1.6"/>

  <!-- Centre boss with its bolt circle. No maker's mark is reproduced. -->
  <circle cx="210" cy="212" r="30" fill="#1a1d22"/>
  <circle cx="210" cy="212" r="19" fill="#262b31"/>
  <g fill="#4c535c">
    <circle cx="210" cy="178" r="4"/><circle cx="210" cy="246" r="4"/>
    <circle cx="180" cy="200" r="4"/><circle cx="240" cy="200" r="4"/>
    <circle cx="180" cy="224" r="4"/><circle cx="240" cy="224" r="4"/>
  </g>

  <!-- The two big lower paddles, with the START/STOP button on the right. -->
  <path d="M130 248 h56 a10 10 0 0 1 10 10 v34 a10 10 0 0 1 -10 10 h-38
           a14 14 0 0 1 -13-9 l-13-34 a8 8 0 0 1 8-11 z" fill="url(#gp-paddle)"/>
  <path d="M290 248 h-56 a10 10 0 0 0 -10 10 v34 a10 10 0 0 0 10 10 h38
           a14 14 0 0 0 13-9 l13-34 a8 8 0 0 0 -8-11 z" fill="url(#gp-paddle)"/>
  <circle cx="272" cy="272" r="13" fill="#d8402f"/>
  <text x="272" y="269" font-family="sans-serif" font-size="6"
        font-weight="700" text-anchor="middle" fill="#fff">START</text>
  <text x="272" y="277" font-family="sans-serif" font-size="6"
        font-weight="700" text-anchor="middle" fill="#fff">STOP</text>
  <!-- Left-hand rotary. -->
  <circle cx="152" cy="278" r="12" fill="#1b1e23" stroke="#4a515b" stroke-width="1.5"/>
  <g stroke="#5a626e" stroke-width="1.4" opacity="0.8">
    <path d="M152 268 v20 M142 278 h20 M145 271 l14 14 M159 271 l-14 14"/>
  </g>
</svg>
