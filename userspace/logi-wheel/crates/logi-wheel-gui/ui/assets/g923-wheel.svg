<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img"
     aria-label="G923 wheel: a round leather-look rim with a blue centre marker, rev lights, a D-pad and console face buttons">
  <title>Logitech G923 Racing Wheel</title>
  <desc>
    Original drawing, not traced from any vendor photograph. A round rim with
    a blue marker at twelve o'clock, a dark hub carrying a rev-light strip, a
    D-pad on the left and four console face buttons on the right.
  </desc>

  <defs>
    <linearGradient id="g9-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3a3f46"/>
      <stop offset="0.42" stop-color="#242830"/>
      <stop offset="1"    stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="g9-hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e333a"/>
      <stop offset="1" stop-color="#1a1d22"/>
    </linearGradient>
    <!-- Leather grain: a sparse speckle, enough to read as hide rather
         than moulded plastic, which is what separates this rim from the
         G PRO's perforated one. -->
    <pattern id="g9-grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#5d646d" opacity="0.22"/>
      <circle cx="6" cy="5" r="0.7" fill="#000"    opacity="0.28"/>
    </pattern>
  </defs>

  <ellipse cx="210" cy="358" rx="118" ry="10" fill="#000" opacity="0.26"/>

  <!-- Rim: a full ring, unlike the G PRO's cut-away lower section. -->
  <circle cx="210" cy="196" r="146" fill="url(#g9-rim)"/>
  <circle cx="210" cy="196" r="146" fill="url(#g9-grain)"/>
  <circle cx="210" cy="196" r="112" fill="#0f1114"/>
  <!-- Blue centre marker at twelve o'clock, the wheel's signature detail. -->
  <rect x="200" y="50" width="20" height="26" rx="4" fill="#1f9fd8"/>

  <!-- Hub: a wide plate spanning the rim, tapering to the lower spoke. -->
  <path d="M112 150 h196 a14 14 0 0 1 14 14 v56 a14 14 0 0 1 -10 13
           l-88 26 a22 22 0 0 1 -28 0 l-88-26 a14 14 0 0 1 -10-13 v-56
           a14 14 0 0 1 14-14 z"
        fill="url(#g9-hub)"/>
  <!-- Lower spoke down to the rim. -->
  <path d="M186 258 h48 l-8 60 h-32 z" fill="#1e2228"/>

  <!-- Rev-light strip across the top of the hub. -->
  <rect x="152" y="136" width="116" height="14" rx="6" fill="#0e1013"/>
  <g>
    <circle cx="164" cy="143" r="3.2" fill="#2fe07a"/>
    <circle cx="181" cy="143" r="3.2" fill="#2fe07a"/>
    <circle cx="198" cy="143" r="3.2" fill="#f2d93b"/>
    <circle cx="215" cy="143" r="3.2" fill="#f2d93b"/>
    <circle cx="232" cy="143" r="3.2" fill="#f2593b"/>
    <circle cx="249" cy="143" r="3.2" fill="#3b7bf2"/>
  </g>

  <!-- D-pad on the left. -->
  <g>
    <circle cx="152" cy="182" r="20" fill="#191c21"/>
    <path d="M152 168 v28 M138 182 h28" stroke="#6d7681" stroke-width="6"
          stroke-linecap="round"/>
  </g>

  <!-- Console face buttons on the right: the four shapes, drawn as outlines
       rather than reproducing any platform's exact glyph artwork. -->
  <g stroke="#8b939f" stroke-width="2" fill="none">
    <circle cx="268" cy="164" r="12" fill="#191c21" stroke="none"/>
    <path d="M268 158 l5 9 h-10 z"/>
    <circle cx="290" cy="186" r="12" fill="#191c21" stroke="none"/>
    <circle cx="290" cy="186" r="5"/>
    <circle cx="246" cy="186" r="12" fill="#191c21" stroke="none"/>
    <rect x="241" y="181" width="10" height="10" rx="1.5"/>
    <circle cx="268" cy="208" r="12" fill="#191c21" stroke="none"/>
    <path d="M264 204 l8 8 M272 204 l-8 8"/>
  </g>

  <!-- Centre boss. -->
  <circle cx="210" cy="196" r="26" fill="#15181c" stroke="#464d56" stroke-width="2"/>
  <circle cx="210" cy="196" r="15" fill="#22262c"/>

  <!-- Shoulder labels and the plus/minus rocker. -->
  <g font-family="sans-serif" font-size="9" text-anchor="middle" fill="#98a1ac">
    <circle cx="146" cy="224" r="12" fill="#20242a"/><text x="146" y="228">L2</text>
    <circle cx="274" cy="224" r="12" fill="#20242a"/><text x="274" y="228">R2</text>
  </g>
  <g>
    <rect x="168" y="248" width="30" height="34" rx="8" fill="#20242a"/>
    <path d="M177 258 h12 M183 252 v12" stroke="#98a1ac" stroke-width="2.4"
          stroke-linecap="round"/>
    <path d="M177 272 h12" stroke="#98a1ac" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- Rotary dial on the right, matching the real wheel's layout. -->
  <circle cx="240" cy="264" r="15" fill="#1b1e23" stroke="#4a515b" stroke-width="1.6"/>
  <g stroke="#5a626e" stroke-width="1.5" opacity="0.8">
    <path d="M240 252 v24 M228 264 h24 M232 256 l16 16 M248 256 l-16 16"/>
  </g>

  <!-- Paddle shifters behind the rim. -->
  <path d="M96 214 q-14 34 4 60 l26-12 q-14-24 -6-46 z" fill="#22262c"/>
  <path d="M324 214 q14 34 -4 60 l-26-12 q14-24 6-46 z" fill="#22262c"/>
</svg>
