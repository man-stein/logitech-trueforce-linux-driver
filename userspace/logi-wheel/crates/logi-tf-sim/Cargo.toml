[package]
name = "logi-tf-sim"
description = "Simulated TrueForce daemon: synthesizes engine haptics from game UDP telemetry"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license = "GPL-2.0-only"

[[bin]]
name = "logi-tf-sim"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# Delade wire-format- och telemetrimodeller (relay, telemetry) bor i core
# så SCS-pluginet och Windows-relayn kan använda samma encoder utan att dra
# in libtrueforce-länkningen; tf-sim re-exporterar dem under sina gamla
# sökvägar.
logi-wheel-core = { path = "../logi-wheel-core" }

