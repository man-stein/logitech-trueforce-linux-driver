# hid-logitech-dd module load ordering, and a narrow, targeted blacklist.
#
# softdep is an ordering hint only - it does not decide which driver wins
# the HID bind race for c266/c267/c26e (that race is settled per-device by
# udev/72-logitech-g923-rebind.rules, which reclaims the wheel from a
# competing driver after the fact regardless of load order). This just
# makes our module's own autoload attempt happen after the in-tree ones
# so the common case does not need the rebind rule at all.
softdep hid-logitech-dd pre: hid-logitech hid-logitech-hidpp

# hid-logitech-new is berarma's standalone "new-lg4ff" DKMS fork. Unlike
# hid-logitech-hidpp, which also drives countless non-wheel Logitech mice,
# keyboards and receivers (blacklisting it would break all of those - see
# README.md and tools/setup.sh), hid-logitech-new exists only to drive
# these same wheels. There is nothing else it does, so blacklisting it
# outright is safe and keeps it from racing hid-logitech-dd for c266/c267.
blacklist hid-logitech-new
