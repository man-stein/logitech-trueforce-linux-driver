# hid-logitech-dd module load ordering, and a narrow, targeted blacklist.
#
# softdep is an ordering hint only - it does not decide which driver wins
# the HID bind race for c266/c267/c26e. That race is settled per-device by
# udev/72-logitech-g923-rebind.rules, which reclaims the wheel from a
# competing driver after the fact.
#
# "post", not "pre". A driver binds matching devices the moment it
# registers, so loading the in-tree modules FIRST hands them the wheel and
# guarantees the rebind dance runs every time - the opposite of what the
# old "pre" comment here claimed it achieved. Loading ours first lets it
# claim the wheel outright, leaving the rebind rule as a fallback rather
# than the primary mechanism, and the in-tree modules still load right
# after for every other Logitech device (and for any interface our probe
# declines).
#
# This is a hint, not a guarantee: at boot udev autoloads every module
# whose MODALIAS matches the device, and the order between those separate
# modprobe invocations is not ordered by this file. Hence the udev rule.
softdep hid-logitech-dd post: hid-logitech hid-logitech-hidpp

# hid-logitech-new is berarma's standalone "new-lg4ff" DKMS fork. It only
# drives wheels, never mice/keyboards/receivers, so blacklisting it here
# cannot break unrelated hardware the way blacklisting hid-logitech-hidpp
# would (that one also serves countless non-wheel Logitech devices - see
# README.md and tools/setup.sh). But new-lg4ff is not scoped to the G923:
# it also drives the G29, G27, DFGT, DFP and other older Logitech wheels.
# A user running it for one of those gets silently downgraded to the
# in-tree hid-logitech (lg4ff) driver for that wheel by this blacklist -
# hid-logitech-dd does not claim those PIDs, so nothing here replaces the
# functionality lost. That is an accepted tradeoff to keep c266/c267 from
# racing between the two forks; it is not "safe for everyone."
blacklist hid-logitech-new
