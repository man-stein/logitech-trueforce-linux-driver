name: Publish release packages

# Fires when you publish a GitHub Release (e.g. `gh release create vX.Y.Z ...`).
# The version is taken from the tag (vX.Y.Z -> X.Y.Z) and stamped into each
# packaging recipe at build time, so nothing in the repo needs bumping by hand.
#
# Channels:
#   * Debian/Ubuntu .deb  -> built here, attached to the release (no secret)
#   * Fedora COPR akmod   -> SRPM submitted to copr (needs secret COPR_CONFIG)
#   * openSUSE OBS RPM    -> committed to home:mescon (needs secret OSC_CONFIG)
#   * Arch AUR            -> logitech-trueforce-dkms/logi-wheel/logi-wheel-gui
#                            pushed to the split package repo (needs secret
#                            AUR_SSH_KEY)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   COPR_CONFIG  the contents of your ~/.config/copr
#   OSC_CONFIG   the contents of your ~/.config/osc/oscrc
#   AUR_SSH_KEY  a dedicated AUR CI SSH private key; the public half is
#                added to the maintainer's AUR account as an authorized
#                key, so it can be revoked independently of the personal key

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.12.1"
        required: true

env:
  # tag name for either trigger; strip the leading v for the bare version
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  # Gate every publish job on a well-formed version tag. TAG comes from a
  # maintainer-published release or a manual dispatch (both require write
  # access), but validating it here means a malformed ref never reaches a
  # checkout `ref:` or a secret-bearing job.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Check tag looks like vX.Y.Z
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "publishing for tag: $TAG" ;;
            *) echo "refusing to publish for unexpected tag: '$TAG'" >&2; exit 1 ;;
          esac

  debian:
    name: Debian/Ubuntu .deb
    needs: validate
    runs-on: ubuntu-latest
    # Only this job needs write access, to attach the .deb to the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper dkms dh-dkms cargo \
            pkg-config libfontconfig-dev
      - name: Install a current Rust toolchain
        # Ubuntu's apt cargo is too old for the workspace (the lockfile
        # needs >= 1.88, the Slint GUI >= 1.92). Keep the apt cargo so
        # dpkg-checkbuilddeps stays satisfied, but build with rustup's
        # stable: ~/.cargo/bin is prepended to PATH so it wins over
        # /usr/bin for every following step.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Stamp version from the tag
        run: |
          set -eu
          VERSION="${TAG#v}"
          {
            echo "logitech-trueforce-dkms (${VERSION}-1) unstable; urgency=medium"
            echo
            echo "  * Release ${VERSION}."
            echo
            echo " -- mescon <5875228+mescon@users.noreply.github.com>  $(date -R)"
          } > packaging/debian/changelog
      - name: Build the .deb
        run: packaging/debian/build-deb.sh "$PWD/out"
      - name: Attach the .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/*.deb --clobber

  copr:
    name: Fedora COPR (akmod)
    needs: validate
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False rpm-build kmodtool kernel-rpm-macros git make copr-cli
      - name: Configure copr-cli
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Build akmod SRPM (version from tag) and submit to COPR
        run: |
          set -eu
          VERSION="${TAG#v}"
          git config --global --add safe.directory '*'
          # Stamp the version so the SRPM (and the akmod COPR rebuilds from it)
          # carries the release version.
          sed -i "s/^%global\\( *\\)upstream_ver.*/%global\\1upstream_ver    ${VERSION}/" \
            packaging/akmods/logitech-trueforce-kmod.spec
          # Build the SRPM directly (git-free). The .copr/Makefile uses
          # `git archive`, which fails inside this container job (git
          # refuses repo discovery across the checkout mount boundary);
          # since the tag is already checked out, tar the working tree
          # instead. COPR's own "make srpm" build method still uses the
          # Makefile's git path on COPR's proper git clone.
          dnf install -y --setopt=install_weak_deps=False rpm-build tar
          PREFIX="logitech-trueforce-linux-driver-${VERSION}"
          SRCDIR="$HOME/rpmbuild/SOURCES"; mkdir -p "$SRCDIR" "$PWD/srpm"
          stage="$(mktemp -d)"; mkdir -p "$stage/$PREFIX"
          tar --exclude=./.git --exclude=./srpm --exclude=./out -cf - . \
            | tar -xf - -C "$stage/$PREFIX"
          tar -czf "$SRCDIR/logitech-trueforce-kmod-${VERSION}.tar.gz" \
            -C "$stage" "$PREFIX"
          rpmbuild -bs packaging/akmods/logitech-trueforce-kmod.spec \
            --define "_sourcedir $SRCDIR" --define "_srcrpmdir $PWD/srpm"
          # --enable-net on: the spec builds the userspace tools with cargo,
          # which fetches crate dependencies over the network (nothing vendored).
          copr-cli build --enable-net on mescon/logitech-trueforce srpm/*.src.rpm

  obs:
    name: openSUSE OBS
    needs: validate
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      # Second checkout: the packaging recipes from the ref this workflow
      # run belongs to (the tag itself on release events, the dispatched
      # branch on workflow_dispatch). Sources always come from the tag,
      # but taking the spec/_service from here lets a manual dispatch
      # re-publish a release with packaging fixes made after the tag,
      # without re-tagging.
      - uses: actions/checkout@v4
        with:
          path: packaging-ref
      - name: Install tools
        # cargo + zstd: the spec builds the Rust workspace offline (OBS
        # builders have no network), so this job vendors the crate
        # dependencies into a zstd tarball shipped as Source1.
        #
        # Refreshed explicitly rather than leaning on zypper's implicit
        # auto-refresh. A fresh Tumbleweed container can arrive with repo
        # metadata it cannot use, and zypper then reports every package as
        # missing including ones already present: the v0.27.2 run failed
        # with "No provider of 'osc' found" alongside "'sed' is already
        # installed. Package 'sed' is not available in your repositories."
        # Tumbleweed rolls daily, so the retry is for a mirror caught
        # mid-sync rather than for a permanent error.
        run: |
          for attempt in 1 2 3; do
            zypper --non-interactive --gpg-auto-import-keys refresh && break
            echo "zypper refresh failed (attempt $attempt), retrying"
            sleep 15
          done
          zypper --non-interactive --gpg-auto-import-keys install -y osc git tar gzip sed cargo zstd
      - name: Configure osc
        env:
          OSC_CONFIG: ${{ secrets.OSC_CONFIG }}
        run: |
          mkdir -p ~/.config/osc
          printf '%s' "$OSC_CONFIG" > ~/.config/osc/oscrc
          chmod 600 ~/.config/osc/oscrc
      - name: Stamp version, generate tarball, commit to OBS
        run: |
          set -eu
          VERSION="${TAG#v}"
          git config --global --add safe.directory '*'
          sed -i "s/^%global\\( *\\)modver.*/%global\\1modver   ${VERSION}/" \
            packaging-ref/packaging/obs/logitech-trueforce-dkms.spec
          sed -i "s/^Version:.*/Version:        ${VERSION}/" \
            packaging-ref/packaging/obs/logitech-trueforce-dkms.spec
          sed -i "s#<param name=\"revision\">[^<]*</param>#<param name=\"revision\">${TAG}</param>#" \
            packaging-ref/packaging/obs/_service
          sed -i "s#<param name=\"version\">[^<]*</param>#<param name=\"version\">${VERSION}</param>#" \
            packaging-ref/packaging/obs/_service
          # git-free tarball: `git archive` fails in this container job
          # (git refuses repo discovery across the checkout mount
          # boundary), and the tag is already checked out, so tar the
          # working tree with the versioned prefix directory.
          PREFIX="logitech-trueforce-linux-driver-${VERSION}"
          stage="$(mktemp -d)"; mkdir -p "$stage/$PREFIX"
          tar --exclude=./.git --exclude=./srpm --exclude=./out \
            --exclude=./packaging-ref -cf - . \
            | tar -xf - -C "$stage/$PREFIX"
          tar -czf "/tmp/${PREFIX}.tar.gz" -C "$stage" "$PREFIX"
          # Vendor the Rust workspace's crate dependencies (Source1). OBS
          # builders have no network access, so `cargo build` in the spec
          # cannot resolve index.crates.io; the spec extracts this tarball
          # and builds --offline against it instead.
          vendorstage="$(mktemp -d)"
          cargo vendor --locked \
            --manifest-path userspace/logi-wheel/Cargo.toml \
            "$vendorstage/vendor"
          tar --zstd -cf "/tmp/logi-wheel-vendor-${VERSION}.tar.zst" \
            -C "$vendorstage" vendor
          work="$(mktemp -d)"; cd "$work"
          osc checkout home:mescon logitech-trueforce-dkms
          cd home:mescon/logitech-trueforce-dkms
          rm -f logitech-trueforce-linux-driver-*.tar.gz logi-wheel-vendor-*.tar.zst
          cp "$GITHUB_WORKSPACE/packaging-ref/packaging/obs/logitech-trueforce-dkms.spec" .
          cp "$GITHUB_WORKSPACE/packaging-ref/packaging/obs/_service" .
          cp "/tmp/logitech-trueforce-linux-driver-${VERSION}.tar.gz" .
          cp "/tmp/logi-wheel-vendor-${VERSION}.tar.zst" .
          osc addremove
          osc commit -m "logitech-trueforce-dkms ${VERSION} (from tag ${TAG})"

  # Build the Arch package before publishing it. The debian, copr and obs
  # jobs all compile what they ship, so a packaging break in those channels
  # fails here rather than on a user's machine; the aur job only ever pushed
  # a PKGBUILD, so Arch was the one channel where a broken recipe reached
  # users unnoticed. This closes that gap: `aur` now needs this job, so a
  # recipe that cannot build is never pushed.
  aur-build:
    name: Arch AUR (build check)
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build the package with makepkg
        run: |
          set -eu
          pacman -Syu --noconfirm --needed curl git sudo

          # makepkg refuses to run as root, so build as an unprivileged
          # user that can still pacman -S the declared makedepends.
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder

          VERSION="${TAG#v}"
          curl --proto '=https' --proto-redir '=https' -fsSL -o src.tar.gz \
            "https://github.com/mescon/logitech-trueforce-linux-driver/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(sha256sum src.tar.gz | cut -d' ' -f1)

          PKG=packaging/aur/logitech-trueforce-dkms
          # Same three fields the publish step stamps, so this builds the
          # exact recipe that would be pushed rather than an approximation.
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "$PKG/PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$PKG/PKGBUILD"
          sed -i "s/^sha256sums=(.*)/sha256sums=('${SHA}')/" "$PKG/PKGBUILD"

          cp -r "$PKG" /home/builder/pkg
          chown -R builder:builder /home/builder/pkg
          sudo -u builder bash -euc '
            cd /home/builder/pkg
            # -s installs the declared makedepends: a dependency the PKGBUILD
            # forgets to declare fails here, which is the point.
            makepkg -s --noconfirm --nocheck
            ls -1 *.pkg.tar.*
          '
      - name: Generate .SRCINFO from the stamped PKGBUILD
        run: |
          set -eu
          # .SRCINFO is GENERATED here, never hand-patched. It stores every
          # field fully expanded, including the source URL, so the previous
          # approach of sed-ing pkgver/pkgrel/sha256sums into the committed
          # copy left `source =` pointing at whatever release it was last
          # written by hand for: 0.22.0 shipped to the AUR claiming version
          # 0.22.0, a v0.18.0 tarball URL, and a checksum for neither.
          # makepkg derives all of it from the PKGBUILD that was just built.
          mkdir -p out
          sudo -u builder bash -euc '
            cd /home/builder/pkg && makepkg --printsrcinfo
          ' > out/.SRCINFO
          cp /home/builder/pkg/PKGBUILD out/PKGBUILD
          grep -E "^\s+(pkgver|pkgrel|source|sha256sums) =" out/.SRCINFO
      - uses: actions/upload-artifact@v4
        with:
          name: aur-package
          path: out/
          include-hidden-files: true
          retention-days: 1

  aur:
    name: Arch AUR
    needs: [validate, aur-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Configure SSH for the AUR git host
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: aur-package
          path: aur-package
      - name: Push the built recipe to the split AUR package
        run: |
          set -eu
          VERSION="${TAG#v}"

          PKG=packaging/aur/logitech-trueforce-dkms
          # The PKGBUILD and .SRCINFO come from aur-build, which stamped the
          # version, built the package with them, and generated the .SRCINFO
          # from that exact PKGBUILD. Nothing is patched here: what gets
          # pushed is what was proven to build, and its metadata is derived
          # rather than hand-edited, which is what let `source` rot to a
          # v0.18.0 URL while pkgver said 0.22.0.
          cp aur-package/PKGBUILD aur-package/.SRCINFO "$PKG/"

          # logitech-trueforce-dkms is a split package: PKGBUILD's pkgname
          # array lists it plus logi-wheel and logi-wheel-gui, so this one push
          # updates all three AUR pages at once.
          work="$(mktemp -d)"
          git clone ssh://aur@aur.archlinux.org/logitech-trueforce-dkms.git "$work/aur"
          cp "$PKG/PKGBUILD" "$PKG/.SRCINFO" "$PKG/logitech-trueforce-dkms.install" "$work/aur/"

          cd "$work/aur"
          git add PKGBUILD .SRCINFO logitech-trueforce-dkms.install
          if [ -z "$(git status --porcelain)" ]; then
            echo "AUR package already at ${VERSION}; nothing to push"
            exit 0
          fi
          git -c user.name="logitech-trueforce release" \
              -c user.email="5875228+mescon@users.noreply.github.com" \
              commit -m "Update to ${VERSION}"
          git push
